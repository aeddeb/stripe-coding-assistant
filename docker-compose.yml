services:
  postgres:
    # pgvector image = standard Postgres + the vector extension pre-installed,
    # used later for embedding storage and similarity search.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stripe_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      # Bind to loopback only — reachable from this machine, not the LAN.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-stripe_assistant}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: infra/app.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8501}:8501"
    environment:
      # Inside the compose network the DB host is the service name.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-stripe_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      # LLM + Stripe keys pass through from .env; unset ones stay unset.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana-oss:12.4.3
    restart: unless-stopped
    ports:
      # Loopback only, same policy as Postgres.
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      # Admin login for editing dashboards; viewers need no login at all.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Anyone opening the page sees the dashboards read-only — no
      # login friction, and the DB role Grafana uses can only SELECT.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Interpolated into the local-Postgres provisioned datasource
      # (read-only DB role).
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana}
      POSTGRES_DB: ${POSTGRES_DB:-stripe_assistant}
      # Interpolated into the Neon (cloud) provisioned datasource — a
      # second, read-only view onto the deployed app's database. Empty
      # defaults so a fresh clone with no Neon project still boots; the
      # datasource just won't have credentials until these are set.
      NEON_DB_HOST: ${NEON_DB_HOST:-}
      NEON_DB_NAME: ${NEON_DB_NAME:-}
      NEON_GRAFANA_DB_PASSWORD: ${NEON_GRAFANA_DB_PASSWORD:-}
    volumes:
      # Datasource + dashboard definitions live in git; the container
      # discovers them at boot — no manual setup.
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  grafana-data:
